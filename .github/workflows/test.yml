name: Run API Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run Local API Tests
        run: |
          chmod +x scrip-test-api-bank-v2/run-all.sh
          # ./scrip-test-api-bank-v2/run-all.sh
      - name: Run Edge Case Tests
        run: |
          chmod +x edge-cases/run-edge-cases.sh
          # ./edge-cases/run-edge-cases.sh
      - name: Run Security Tests
        run: |
          chmod +x security/run-security.sh
          # ./security/run-security.sh
